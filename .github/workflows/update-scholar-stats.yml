name: Update Google Scholar Stats

on:
  schedule:
    - cron: "0 2 * * *" # Daily, 10:00 China Standard Time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public Scholar metrics
        run: python tools/update_scholar_stats.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar.json
          git diff --staged --quiet || git commit -m "Refresh Google Scholar statistics"
          git push
